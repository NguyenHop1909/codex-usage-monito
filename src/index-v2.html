<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Usage</title><link rel="stylesheet" href="styles-v2.css"></head><body><main><header><div><h1>Codex Usage</h1><p id="status">Đang khởi động…</p></div><span id="dot"></span></header><section id="limits"></section><section class="panel"><div class="section-title"><b>Xu hướng 7 ngày</b><span id="forecast">Đang thu thập dữ liệu</span></div><canvas id="chart" width="440" height="100"></canvas></section><details class="panel"><summary>Cài đặt</summary><label>Kiểm tra mỗi <select id="poll"><option value="1">1 phút</option><option value="5">5 phút</option><option value="10">10 phút</option><option value="15">15 phút</option></select></label><label><input id="auto" type="checkbox"> Chạy cùng Windows</label><label><input id="sound" type="checkbox"> Âm thanh cảnh báo</label><div class="quiet">Không làm phiền <input id="qs" type="number" min="0" max="23">h–<input id="qe" type="number" min="0" max="23">h</div></details><p id="updated"></p><div class="actions"><button id="refresh">Làm mới</button><button id="login" class="secondary">Kết nối lại</button><button id="hide" class="ghost">Ẩn xuống tray</button></div></main><script src="renderer-v2.js"></script></body></html>
